user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format json_combined escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"service":"nginx",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"body_bytes_sent":$body_bytes_sent'
    '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;

        location / {
            return 200 "OK - Home\n";
        }

        location /api/users {
            return 200 '{"users": ["alice", "bob"]}';
            add_header Content-Type application/json;
        }

        location /api/orders {
            return 200 '{"orders": []}';
            add_header Content-Type application/json;
        }

        location /notfound {
            return 404 "Not Found\n";
        }

        location /error {
            return 500 "Internal Server Error\n";
        }

        location /slow {
            # Simule une latence via un petit délai (module echo non dispo par défaut,
            # on garde cette route pour varier les temps de réponse naturellement)
            return 200 "Slow response\n";
        }
    }
}
