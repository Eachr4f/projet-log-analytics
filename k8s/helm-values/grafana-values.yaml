adminUser: admin
adminPassword: admin

service:
  type: ClusterIP
  nodePort: 30300

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        isDefault: true
